[project]
name = "qrc-nqs"
version = "0.1.0"
description = "Neural quantum states (NetKet 3) as a probe for quantum reservoir computing and QELM."
readme = "README.md"
authors = [
    { name = "victor-pcll", email = "victor.peucelle@epfl.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.7",
    "matplotlib>=3.11.2",
    "netket>=3.20",
    "numpy>=2.5.3",
    "optax>=0.2",
    "python-dotenv>=1.2.3",
    "scipy>=1.14",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Namespace package: src/QRC has no __init__.py, src/QRC/NQS is the library.
module-name = "QRC.NQS"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["QRC"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/QRC", "main.py"]
disallow_untyped_defs = true
warn_unused_ignores = true
explicit_package_bases = true

# NetKet and SciPy ship no type information; their objects are typed as Any.
[[tool.mypy.overrides]]
module = ["netket", "netket.*", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/ mirrors src/QRC/NQS/ and may reuse file names across folders.
addopts = "--import-mode=importlib"

# Optax ships no type information either.
[[tool.mypy.overrides]]
module = ["optax", "optax.*"]
ignore_missing_imports = true
