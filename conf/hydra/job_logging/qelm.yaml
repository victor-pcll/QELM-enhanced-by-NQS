# Hydra's default job logging, with the log file moved into <run>/logs/.
# The factory creates logs/ before opening the file.
version: 1
formatters:
  simple:
    format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    stream: ext://sys.stdout
  file:
    (): QELM.NQS.logging_utils.file_handler
    formatter: simple
    filename: ${hydra.runtime.output_dir}/logs/${hydra.job.name}.log
root:
  level: INFO
  handlers: [console, file]

disable_existing_loggers: false
